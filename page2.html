
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Oye Bhadwe!</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b1220;
            color: white;
            font-family: Arial, sans-serif;
        }

        .message-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .message-box {
            max-width: 750px;
            width: 100%;
            background: #121e31;
            border: 1px solid #263449;
            border-radius: 15px;
            padding: 55px 35px;
            text-align: center;
            box-shadow: 0 20px 60px #0008;
        }

        .small-heading {
            color: #78e0c2;
            font-size: 12px;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: clamp(38px, 8vw, 65px);
            margin-bottom: 25px;
        }

        h1 span {
            color: #78e0c2;
        }

        .funny-message {
            color: #a5b2c6;
            font-size: 20px;
            line-height: 2;
            margin-bottom: 35px;
        }

        .main-btn {
            display: inline-block;
            background: #78e0c2;
            color: #07120f;
            padding: 16px 27px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .main-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px #78e0c255;
        }

        @media (max-width: 600px) {
            .message-box {
                padding: 40px 22px;
            }

            .funny-message {
                font-size: 17px;
            }
        }

    </style>
</head>

<body>

    <section class="message-page">

        <div class="message-box">

            <p class="small-heading">
                ⚡ WELCOME TO THE REALITY
            </p>

            <h1>
                OYE <span>BHADWE!</span>
            </h1>

            <p class="funny-message">
                Haan bhadwe! Har jagah teri gaand mein
                ungli karne ki aadat hai. Yahan bhi tune
                ungli karke click toh kar liya, lekin apni
                gaand pesh nahi kar. Wapas back kar! 😂
            </p>

            <a href="index.html" class="main-btn">
                WAPAS BACK KAR ↩
            </a>

        </div>

    </section>

</body>
</html>
